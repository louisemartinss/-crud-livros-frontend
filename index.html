<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Usuários</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Usuários</h1>
        <p>Gerencie os usuários cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo usuário</h2>

        <form id="form-usuario">
          <input type="hidden" id="usuario-id">

          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" required>

          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" required>

          <label for="idade">Idade</label>
          <input id="idade" name="idade" type="number" min="0">

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Usuários</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar usuário pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do usuário">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-usuarios" class="lista-usuarios"></div>
      </section>

      <section class="painel">
  <h2 id="titulo-formulario-livro">Novo livro</h2>

  <form id="form-livro">
    <input type="hidden" id="livro-id">

    <label for="titulo">Título</label>
    <input id="titulo" name="titulo" type="text" required>

    <label for="autor">Autor</label>
    <input id="autor" name="autor" type="text" required>

    <label for="anoPublicacao">Ano de publicação</label>
    <input id="anoPublicacao" name="anoPublicacao" type="number" min="0">

    <div class="acoes-formulario">
      <button type="submit" id="botao-salvar-livro">Cadastrar</button>
      <button type="button" id="botao-cancelar-livro" class="secundario oculto">
        Cancelar edição
      </button>
    </div>
  </form>
</section>

<section class="painel">
  <div class="cabecalho-lista">
    <h2>Livros</h2>
    <button type="button" id="botao-atualizar-livro" class="secundario">Atualizar lista</button>
  </div>

  <form id="form-busca-livro" class="busca">
    <label for="busca-id-livro">Buscar livro pelo ID</label>
    <div class="linha-busca">
      <input id="busca-id-livro" type="text" placeholder="Informe o ID do livro">
      <button type="submit">Buscar</button>
      <button type="button" id="botao-limpar-busca-livro" class="secundario">Listar todos</button>
    </div>
  </form>

  <p id="mensagem-livro" role="status" aria-live="polite"></p>
  <div id="lista-livros" class="lista-usuarios"></div>
</section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
